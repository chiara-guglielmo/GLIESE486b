dataset_path: "./data/tess_data.csv"

device: cpu

# Default neural-network architecture
CNN_params:
  - conv_filters: [32, 64, 128]
    kernel_size: 7
    pooling_size: 2
    pooling_output_size : 8
    dropout_rates_1: [0.3, 0.4, 0.4]
    dropout_rates_2: [0.4, 0.4]
    hidden_dims: [128, 64]
    learning_rate: 2e-4
    batch_size: 64
    epochs: 150

# Deeper convolutional block and smaller kernel
  - conv_filters: [32, 64, 128, 128]
    kernel_size: 5
    pooling_size: 2
    pooling_output_size : 6
    dropout_rates_1: [0.2, 0.2, 0.3, 0.3]
    dropout_rates_2: [0.3, 0.2]
    hidden_dims: [128, 64]
    learning_rate: 3e-4
    batch_size: 64
    epochs: 150

# Wider kernel and larger batch size
  - conv_filters: [32, 64, 128]
    kernel_size: 9
    pooling_size: 2
    pooling_output_size: 6
    dropout_rates_1: [0.2, 0.3, 0.4]
    dropout_rates_2: [0.3, 0.2]
    hidden_dims: [128, 64]
    learning_rate: 2e-4
    batch_size: 128
    epochs: 150

# Lighter convolutional block, larger batch size and higher initial learning rate
  - conv_filters: [64, 128]
    kernel_size: 7
    pooling_size: 2
    pooling_output_size : 8
    dropout_rates_1: [0.3, 0.4]
    dropout_rates_2: [0.4, 0.3]
    hidden_dims: [128, 64]
    learning_rate: 5e-4
    batch_size: 128
    epochs: 150